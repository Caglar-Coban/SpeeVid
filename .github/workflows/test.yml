name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 29 needs Node 20.19+ / 22.13+ / 24+
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

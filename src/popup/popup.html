<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title>SpeeVid</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="logo-dot"></span>
      <h1>SpeeVid</h1>
    </header>

    <section id="videoSection" class="section" hidden>
      <div class="speed-display">
        <span id="speedValue">1x</span>
      </div>
      <input type="range" id="speedSlider" class="slider" min="0.25" max="3" step="0.05" value="1" />
      <div id="presets" class="presets"></div>
    </section>

    <section id="emptySection" class="section empty" hidden>
      <p>Bu sayfada video bulunamadı.</p>
    </section>

    <section id="unsupportedSection" class="section empty" hidden>
      <p>Bu sayfada SpeeVid çalışmıyor.</p>
    </section>

    <footer class="app-footer">
      <label class="toggle-row">
        <span>Video üzerinde kontrolü göster</span>
        <span class="switch">
          <input type="checkbox" id="floatingToggle" />
          <span class="slider-switch"></span>
        </span>
      </label>
      <label class="toggle-row">
        <span>Klavye kısayollarını etkinleştir</span>
        <span class="switch">
          <input type="checkbox" id="shortcutsToggle" />
          <span class="slider-switch"></span>
        </span>
      </label>
    </footer>
  </div>

  <script src="../shared/speed-utils.js"></script>
  <script src="../shared/storage-helpers.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
